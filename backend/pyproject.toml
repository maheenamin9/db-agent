[project]
name = "db-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "gspread>=6.2.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the seeded docker-compose Postgres/MySQL (skipped when unreachable)"]
